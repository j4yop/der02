[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "der02"
version = "0.2.0"
description = "Threat-zone estimation for industrial fire and explosion response. TNO blast overpressure and solid-flame thermal radiation with wind distortion, drawn on a real map."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "der02 contributors" }]
# Slim dependency set: only what `src/der02/`, `api.py`, and
# `streamlit_app.py` actually import. The previous list included
# `geopandas`, `scipy`, `pandas`, `pyarrow`, `streamlit`, and
# `streamlit-folium` defensively, but **nothing in the codebase
# imports them**. Removing them drops the Vercel bundle from
# 596 MB (over the 500 MB limit) to ~50-100 MB.
#
# For the Streamlit UI specifically, you may also need
# `streamlit>=1.32` and `streamlit-folium>=0.18` at runtime — install
# those separately with `pip install streamlit streamlit-folium`
# or use `requirements.txt` which has the full set.
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
    "folium>=0.15",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
ui = [
    "streamlit>=1.32",
    "streamlit-folium>=0.18",
]

[project.urls]
"Source code" = "https://github.com/j4yop/der02"
"Issues" = "https://github.com/j4yop/der02/issues"

# Vercel auto-detects the FastAPI `app` instance in `app.py` (the standard
# entrypoint name). No tool.vercel.entrypoint override needed.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"app.py" = ["E402"]  # sys.path setup must precede third-party imports
